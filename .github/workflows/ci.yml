name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check telegraf/credentials.py tests/ scripts/
          ruff format --check telegraf/credentials.py tests/ scripts/

      - name: Run tests
        run: pytest tests/ -v

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: Lint shell scripts
        run: |
          shellcheck lib/utm-common.sh upgrade_utm.sh backup_utm_dashboards.sh

      - name: Run bats tests
        run: bats tests/bash/
