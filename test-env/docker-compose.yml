name: ${COMPOSE_PROJECT_NAME:-utm-test}

networks:
  utm-net:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:

services:
  influxdb:
    image: influxdb:${INFLUXDB_VERSION:-1.11}
    container_name: utm-influxdb
    restart: unless-stopped
    networks:
      - utm-net
    ports:
      - "127.0.0.1:${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb/init.iql:/docker-entrypoint-initdb.d/init.iql:ro
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      INFLUXDB_REPORTING_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.4.0}
    container_name: utm-grafana
    restart: unless-stopped
    networks:
      - utm-net
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "agenty-flowcharting-panel,grafana-piechart-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  syn-data:
    build:
      context: ./syn-data
    container_name: utm-syn-data
    restart: unless-stopped
    networks:
      - utm-net
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INTERVAL_SECONDS: ${SYN_INTERVAL_SECONDS:-10}
      DOMAINS: "10.0.0.10,10.0.0.20"
      LOCATIONS: "Production,DR"
      INFLUX_URL: http://influxdb:8086
      INFLUX_DB: telegraf
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  telegraf:
    build:
      context: ./telegraf
    image: utm-telegraf:test
    container_name: utm-telegraf
    restart: unless-stopped
    networks:
      - utm-net
    depends_on:
      influxdb:
        condition: service_healthy
    env_file:
      - ./creds.env
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ../telegraf/ucs_traffic_monitor.py:/utm/ucs_traffic_monitor.py:ro
      - ../telegraf/credentials.py:/utm/credentials.py:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
